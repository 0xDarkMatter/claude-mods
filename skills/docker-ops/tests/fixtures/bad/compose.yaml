# Fixture: every Compose landmine docker-audit.py checks for. Not a real stack.
version: "3.9"
x-common: &common
  restart: unless-stopped
services:
  app:
    <<: *common
    build: .
    image: myapp
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: changeme-fixture-value
      LOG_LEVEL: debug
    depends_on:
      - db
      - cache
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appdata:/data
    networks: [backend]
  db:
    image: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=changeme-fixture-value
  cache:
    image: redis:latest
    privileged: true
    network_mode: host
  worker:
    image: myorg/worker:1.2.3
    depends_on:
      cache:
        condition: service_healthy
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp:unconfined
    volumes:
      - ~/.ssh:/root/.ssh:ro
    secrets:
      - api_token
volumes:
  appdata:
