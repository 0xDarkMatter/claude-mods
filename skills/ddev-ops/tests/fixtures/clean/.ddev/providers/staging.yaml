# Fixture: a pull-only provider recipe (no push stanzas, and no files_pull_command at all:
# a stanza that fetches nothing makes `ddev pull` empty the upload directory).
environment_variables:
  dburl: deploy@staging.example.com:dumps/sanitized.sql.gz

db_pull_command:
  command: |
    set -eu -o pipefail
    rsync -az "${dburl}" /var/www/html/.ddev/.downloads/db.sql.gz
  service: web
