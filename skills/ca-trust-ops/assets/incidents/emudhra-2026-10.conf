# ca-trust-ops incident pack: the eMudhra CA compromise of October 2026.
#
# Read by scripts/check-ca-trust.sh (bash 3.2, no jq or python) and
# scripts/check-ca-trust.ps1 (PowerShell 5.1). The format, the field rules and the
# procedure for adding a pack are in references/incident-packs.md; where every value
# below comes from, and how each key was verified, is in references/emudhra-2026-10.md.
# One record per line, fields separated by "|", "#" starts a comment line. ASCII only.
# tests/run.sh fails when the keys here differ from the keys of the certificates in
# tests/fixtures/emudhra-2026-10/, so change the two together.

id|emudhra-2026-10
name|eMudhra
title|eMudhra CA compromise, October 2026
as_of|2026-10-26
reference|references/emudhra-2026-10.md

# key|<SHA-256 of the DER SubjectPublicKeyInfo>|<certificate name>|<that SPKI, base64>.
# The key, not the certificate: matching it catches every certificate built on it (the
# eMudhra-issued intermediate, its Sectigo cross-sign, any re-issued copy of a root).
# The SPKI lets the bash checker find candidates without hashing every certificate;
# its SHA-256 must equal the hash (tests/run.sh checks). scripts/pack-keys.sh prints
# these lines from the certificates.
